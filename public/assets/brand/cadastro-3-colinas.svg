<path d="M0 854v-50h33v-20h25v36h23v-45h41v79h13v-28h36v-51h30v79h19v-67h54v67h29v-37h21v37h28v-88h36v88h34v-53h37v53h22v-77h46v77h23v-31h24v31h34v-62h38v62h17v-41h44v41h20v-56h39v56h40v-83h31v83h31v-35h42v35h17v-64h42v64h24v-47h47v47h31v-30h33v30h28v-43h49v43h28v-85h38v85H1280v40H0Z"/>
</g>
<path d="M0 770h1280v125H0Z" fill="url(#windows)" opacity=".6"/>
<!-- Quiet basketball context: court outline and one hoop on the far right -->
