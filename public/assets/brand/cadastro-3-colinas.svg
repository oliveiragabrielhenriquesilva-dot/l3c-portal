<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Três colinas ao pôr do sol, cidade e quadra de basquete">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061428"/><stop offset=".48" stop-color="#142840"/><stop offset=".75" stop-color="#71402e"/><stop offset="1" stop-color="#ff7e2f"/></linearGradient>
 <radialGradient id="horizon" cx="82%" cy="49%" r="52%"><stop stop-color="#ff853c" stop-opacity=".85"/><stop offset=".43" stop-color="#e86b33" stop-opacity=".26"/><stop offset="1" stop-color="#0b1d31" stop-opacity="0"/></radialGradient>
 <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17263d"/><stop offset="1" stop-color="#071827"/></linearGradient>
 <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#152338"/><stop offset="1" stop-color="#051422"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081a2d"/><stop offset="1" stop-color="#03101e"/></linearGradient>
 <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#041324" stop-opacity=".74"/><stop offset=".52" stop-color="#041324" stop-opacity=".52"/><stop offset="1" stop-color="#041324" stop-opacity=".06"/></linearGradient>
 <linearGradient id="lowerShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061728" stop-opacity="0"/><stop offset="1" stop-color="#04101d" stop-opacity=".9"/></linearGradient>
 <pattern id="court" width="92" height="92" patternUnits="userSpaceOnUse"><path d="M0 0H92M0 0V92" fill="none" stroke="#b3cde0" stroke-opacity=".05" stroke-width="1"/></pattern>
 <pattern id="windows" width="23" height="28" patternUnits="userSpaceOnUse"><path d="M6 7h4v5H6z M16 18h3v4h-3z" fill="#ff9f55" fill-opacity=".4"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<!-- Sky and warm evening glow, no lettering or logos printed into the background -->
<rect width="1280" height="1100" fill="url(#sky)"/>
<rect width="1280" height="1100" fill="url(#horizon)"/>
<ellipse cx="1068" cy="518" rx="340" ry="73" fill="#ff9d57" opacity=".20" filter="url(#blur)"/>
<g fill="#9ab3c5" opacity=".11"><path d="M0 178q123-100 267-20q75 43 170 6q83-32 171 25q-148-23-256 13Q166 233 0 178Z"/><path d="M575 252q155-101 319-38q96 37 194 1q110-38 192 4q-175 3-298 32q-206 50-407 1Z"/></g>
