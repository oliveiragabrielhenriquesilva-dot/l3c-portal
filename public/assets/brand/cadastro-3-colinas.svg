<path d="M0 740 C120 711 182 600 252 553 Q281 525 302 546 C378 614 428 693 505 688 Q544 687 578 650 C639 586 684 481 744 476 C796 475 865 609 913 610 Q961 616 998 576 C1045 524 1102 476 1151 493 C1209 514 1259 581 1280 592 L1280 1100H0Z" fill="url(#ridgeBack)"/>
